name: sync-index

on:
  schedule:
    # 每 8 小时一次（UTC）
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成 index.json
        run: node src/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交 index.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync index.json'
          file_pattern: index.json
